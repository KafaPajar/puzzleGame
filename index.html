<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Otak Asah – Prototipe</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3ee;--card:#fbfcfa;--ink:#27302b;--mute:#66726a;--pri:#4f7a5c;--pri-ink:#fff;--acc:#e3e8df;--ok:#2f6b42;--bad:#a8544a;--line:#d5dcd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b201c;--card:#242b26;--ink:#e8ede6;--mute:#9aa89d;--pri:#8fbf9b;--pri-ink:#14201a;--acc:#2f3a32;--ok:#9fcfab;--bad:#d9958c;--line:#364039}}
:root{color-scheme:light dark}:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="dark"]{--bg:#1b201c;--card:#242b26;--ink:#e8ede6;--mute:#9aa89d;--pri:#8fbf9b;--pri-ink:#14201a;--acc:#2f3a32;--ok:#9fcfab;--bad:#d9958c;--line:#364039}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;font-weight:500;font-size:17px;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:2.2rem;font-weight:800;margin:8px 0 0;letter-spacing:-.5px}
h2{font-size:1.4rem;margin:0}
p{margin:4px 0 12px;color:var(--mute)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 14px;font-weight:700}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--pri);color:var(--pri-ink);min-height:48px}
button.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
button:disabled{opacity:.45}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.seg button{background:var(--card);color:var(--ink);border:2px solid var(--line);line-height:1.2;padding:8px}.seg button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}#ch{margin:14px 0}
.menu{display:grid;gap:12px;margin-top:16px}
.menu button{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);padding:16px}
.menu b{display:block;font-size:1.15rem}.menu small{color:var(--mute);font-weight:500}
.ico{font-size:2rem;width:48px;text-align:center}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-top:8px}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 18px}
.seq span{min-width:52px;padding:12px 8px;text-align:center;font-size:1.5rem;font-weight:800;border-radius:14px;background:var(--bg);border:2px solid var(--line)}
.seq span.q{background:var(--acc);color:var(--ink);border-color:var(--pri)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{font-size:1.4rem;background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.opts button.ok{background:var(--ok);color:var(--pri-ink);border-color:var(--ok)}
.opts button.no{background:var(--bad);color:var(--pri-ink);border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;aspect-ratio:1;max-width:340px;margin:12px auto}
.tile{font-size:2.2rem;font-weight:800;border-radius:16px;background:var(--pri);color:var(--pri-ink);padding:0;min-height:0}
.tile.empty{background:transparent;border:2px dashed var(--line);pointer-events:none}
.tile.right{background:var(--ok);color:var(--pri-ink)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row>*{flex:1}
input{width:100%;font:inherit;font-weight:700;font-size:1.2rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.msg{min-height:1.6em;margin:10px 0 0;font-weight:700;color:var(--mute)}
.msg.ok{color:var(--ok)}.msg.no{color:var(--bad)}
.stars{font-size:2.4rem;letter-spacing:4px;text-align:center}
.prog{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--pri);transition:width .3s}
#mw{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:6px;pointer-events:none;z-index:5}
#mw svg{width:68px;height:68px;display:block;overflow:visible}
#mas{--ow-wing:#2f6b42;--ow-body:#4f7a5c;--ow-belly:#e3e8df;--ow-eye:#fff;--ow-ink:#27302b;--ow-beak:#c9a36a;forced-color-adjust:none}
#mb{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px 10px;font-weight:700;font-size:.95rem;max-width:55vw;opacity:0;transition:opacity .2s}
#mb.on{opacity:1}
#mas *{transition:opacity .2s,transform .25s}
#mas .eh,#mas .bs,#mas .sm,#mas .fr,#mas .bl,#mas .tr,#mas .sp{opacity:0}
#mas .wl,#mas .wr,#mas .pp{transform-box:fill-box}
#mas .wl{transform-origin:50% 15%}#mas .wr{transform-origin:50% 15%}
#mas.happy .eo{opacity:0}
#mas.happy .eh,#mas.happy .sm,#mas.happy .bl{opacity:1}
#mas.proud .sm,#mas.proud .bl,#mas.proud .sp{opacity:1}
#mas.proud .pp{transform:translateY(-1.5px)}
#mas.happy .wl,#mas.proud .wl{transform:rotate(35deg)}
#mas.happy .wr,#mas.proud .wr{transform:rotate(-35deg)}
#mas.sad .bs,#mas.sad .fr,#mas.sad .tr{opacity:1}
#mas.sad .pp{transform:translateY(2px)}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes droop{to{transform:translateY(4px) scaleY(.95)}}
#mas.happy,#mas.proud{animation:hop .6s ease 2}
#mas.sad{animation:droop .4s ease forwards;transform-origin:50% 100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="mw"><div id="mb" aria-live="polite"></div>
<svg id="mas" class="idle" viewBox="0 0 100 100" aria-hidden="true">
<g class="wl"><ellipse cx="17" cy="62" rx="9" ry="16" fill="var(--ow-wing)" transform="rotate(12 17 62)"/></g>
<g class="wr"><ellipse cx="83" cy="62" rx="9" ry="16" fill="var(--ow-wing)" transform="rotate(-12 83 62)"/></g>
<ellipse cx="40" cy="94" rx="9" ry="4" fill="var(--ow-beak)"/><ellipse cx="60" cy="94" rx="9" ry="4" fill="var(--ow-beak)"/>
<path d="M24 34 L28 12 L44 26Z M76 34 L72 12 L56 26Z" fill="var(--ow-wing)"/>
<ellipse cx="50" cy="58" rx="34" ry="35" fill="var(--ow-body)"/>
<ellipse cx="50" cy="72" rx="20" ry="18" fill="var(--ow-belly)"/>
<g class="eo"><circle cx="38" cy="48" r="9" fill="var(--ow-eye)"/><circle cx="62" cy="48" r="9" fill="var(--ow-eye)"/><circle class="pp" cx="38" cy="49" r="4.5" fill="var(--ow-ink)"/><circle class="pp" cx="62" cy="49" r="4.5" fill="var(--ow-ink)"/></g>
<g class="eh" fill="none" stroke="var(--ow-ink)" stroke-width="3.5" stroke-linecap="round"><path d="M30 51 Q38 40 46 51"/><path d="M54 51 Q62 40 70 51"/></g>
<g class="bs" stroke="var(--ow-ink)" stroke-width="3" stroke-linecap="round"><path d="M29 37 L45 42"/><path d="M71 37 L55 42"/></g>
<path d="M45 56 L55 56 L50 64Z" fill="var(--ow-beak)"/>
<path class="sm" d="M42 68 Q50 76 58 68" fill="none" stroke="var(--ow-ink)" stroke-width="2.5" stroke-linecap="round"/>
<path class="fr" d="M43 74 Q50 67 57 74" fill="none" stroke="var(--ow-ink)" stroke-width="2.5" stroke-linecap="round"/>
<g class="bl" fill="#e8a79b"><ellipse cx="28" cy="60" rx="5" ry="3"/><ellipse cx="72" cy="60" rx="5" ry="3"/></g>
<path class="tr" d="M66 56 q-4 7 0 9 q4 -2 0 -9z" fill="#8fc3d9"/>
<g class="sp" fill="#d9a24a"><path d="M8 18 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/><path d="M90 8 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z"/></g>
</svg></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
let S={stars:0,diff:0,snd:true,mus:true,prog:{p:[1,1,1],s:[1,1,1],r:[0,0,0]}};
try{const j=JSON.parse(localStorage.getItem('otakasah')||'null');if(j&&j.prog)S=Object.assign(S,j)}catch(e){}
let totalStars=S.stars||0,diff=S.diff||0;
function save(){try{S.stars=totalStars;S.diff=diff;S.snd=snd;S.mus=mus;localStorage.setItem('otakasah',JSON.stringify(S))}catch(e){}}
function sv(k,v){S.prog[k][diff]=v;save()}
const DF=[{e:'😁',n:'Mudah'},{e:'🙂',n:'Sedang'},{e:'🫪',n:'Susah'}];
let snd=S.snd!==false,mus=S.mus!==false,AC,OUT,mBus,mT=0,mG,rc=0,susT,mi=0;
function ctx(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=1;OUT.connect(AC.destination)}return AC}
const tone=(f,s,d,ty='sine',v=.18)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+s;o.type=ty;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(OUT);o.start(t);o.stop(t+d+.05)};
const SFX={tap:()=>tone(520,0,.08,'triangle',.12),ok:()=>{tone(660,0,.15);tone(880,.12,.25)},no:()=>{tone(220,0,.2,'sawtooth',.07);tone(165,.15,.25,'sawtooth',.07)},hint:()=>{tone(784,0,.12,'triangle');tone(988,.1,.18,'triangle')},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3))};
function play(n){setTimeout(save,0);if(!snd)return;try{ctx();if(AC.state==='suspended'&&!document.hidden)AC.resume();SFX[n]()}catch(e){}}
function toggleSnd(){snd=!snd;play('tap');home()}
function mtone(f,t,d,ty,v,a){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.linearRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mBus);o.start(t);o.stop(t+d+.1)}
const SC=[262,294,330,392,440,523,587],CH=[[131,196,330],[110,165,262],[175,262,349],[196,294,392]];
function mstep(){
 /* jangan menjadwalkan nada saat konteks audio belum berjalan / tab tersembunyi (mencegah nada menumpuk lalu meledak sekaligus) */
 if(!mus||document.hidden||!AC||AC.state!=='running')return;
 const t=AC.currentTime;
 if(mi%4===0)CH[(mi/4)%4].forEach(f=>mtone(f,t,8,'sine',.05,2.5));
 if(Math.random()<.7)mtone(SC[rnd(0,SC.length-1)],t+Math.random()*.5,2.4,'triangle',.07,.05);
 mi++}
function musicOn(){try{ctx();if(document.hidden)return;if(AC.state==='suspended')AC.resume();if(mT)return;
 if(!mG){/* graf audio dibuat sekali saja, lalu dipakai ulang */
  mG=AC.createGain();mG.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;
  const dl=AC.createDelay(1);dl.delayTime.value=.45;const fb=AC.createGain();fb.gain.value=.4;dl.connect(fb);fb.connect(dl);
  lp.connect(mG);lp.connect(dl);dl.connect(mG);mG.connect(OUT);mBus=lp}
 const t=AC.currentTime;mG.gain.cancelScheduledValues(t);mG.gain.setValueAtTime(mG.gain.value,t);mG.gain.linearRampToValueAtTime(.5,t+.4);
 mstep();mT=setInterval(mstep,1800)}catch(e){}}
function musicOff(){clearInterval(mT);mT=0;try{const t=AC.currentTime;mG.gain.cancelScheduledValues(t);mG.gain.setTargetAtTime(0,t,.15)}catch(e){}}
function toggleMus(){mus=!mus;save();mus?musicOn():musicOff();play('tap');home()}
/* Keluar/pindah tab: hentikan penjadwal, redam suara dengan halus, baru suspend (tanpa letupan/klik) */
function sleepAudio(){clearInterval(mT);mT=0;if(!AC)return;try{const t=AC.currentTime;OUT.gain.cancelScheduledValues(t);OUT.gain.setValueAtTime(OUT.gain.value,t);OUT.gain.setTargetAtTime(0,t,.04);clearTimeout(susT);susT=setTimeout(()=>{try{AC.suspend()}catch(e){}},300)}catch(e){}}
function wakeAudio(){clearTimeout(susT);if(!AC)return;try{AC.resume();const t=AC.currentTime;OUT.gain.cancelScheduledValues(t);OUT.gain.setValueAtTime(OUT.gain.value,t);OUT.gain.linearRampToValueAtTime(1,t+.25)}catch(e){}if(mus)musicOn()}
document.addEventListener('visibilitychange',()=>document.hidden?sleepAudio():wakeAudio());
window.addEventListener('pagehide',()=>{clearInterval(mT);mT=0;try{OUT.gain.setTargetAtTime(0,AC.currentTime,.02)}catch(e){}});
window.addEventListener('pageshow',e=>{if(e.persisted)wakeAudio()});
function resetAll(){if(!rc){rc=1;$('#rs').textContent='Ketuk lagi untuk menghapus semua progres';return}rc=0;totalStars=0;S.prog={p:[1,1,1],s:[1,1,1],r:[0,0,0]};save();home()}
document.addEventListener('click',e=>{if(mus)musicOn();if(e.target.closest('button')&&!e.target.closest('.opts,.tile,#hb,#go'))play('tap')});
const MSG={happy:['Yey, benar!','Mantap!','Kamu pintar!'],proud:['Luar biasa! Aku bangga!','Sempurna!'],sad:['Yah, coba lagi ya','Tidak apa-apa, semangat!']};
let moodT;
function mood(m,t){const s=$('#mas'),b=$('#mb');clearTimeout(moodT);s.setAttribute('class','');void s.getBoundingClientRect();s.setAttribute('class',m);const a=MSG[m];b.textContent=t||(a?a[rnd(0,a.length-1)]:'');b.classList.toggle('on',!!b.textContent);if(m!=='idle')moodT=setTimeout(()=>mood('idle'),2400)}
function setDiff(n){diff=n;home()}
const bar=(title,sub)=>`<div class="top"><button class="ghost" onclick="home()" aria-label="Kembali">←</button><h2>${title}</h2><span class="pill">${DF[diff].e} ⭐ ${totalStars}</span></div>${sub?`<p>${sub}</p>`:''}`;
const stars=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);

function home(){rc=0;
 app.innerHTML=`<div class="top"><span style="display:flex;gap:8px"><button class="ghost" onclick="toggleSnd()" aria-label="Efek suara">${snd?'🔊':'🔇'}</button><button class="ghost" onclick="toggleMus()" aria-label="Musik latar">${mus?'🎵':'🔕'}</button></span><span class="pill">⭐ ${totalStars}</span></div>
 <h1>Asah Otak Kamu 🧠</h1><p>Pilih tingkat kesulitan, lalu pilih tantangan:</p>
 <div class="seg" role="group" aria-label="Tingkat kesulitan">${DF.map((d,i)=>`<button class="${i===diff?'on':''}" aria-pressed="${i===diff}" onclick="setDiff(${i})">${d.e}<br>${d.n}</button>`).join('')}</div>
 <div class="menu">
 <button onclick="pattern(${S.prog.p[diff]})"><span class="ico">🔢</span><span><b>Pola Angka</b><small>Lanjut dari level ${S.prog.p[diff]} dari 6</small></span></button>
 <button onclick="slide(${S.prog.s[diff]})"><span class="ico">🧩</span><span><b>Geser Angka</b><small>Lanjut dari level ${S.prog.s[diff]} dari 4</small></span></button>
 <button onclick="riddle(${S.prog.r[diff]})"><span class="ico">💡</span><span><b>Teka-Teki</b><small>Lanjut dari soal ${S.prog.r[diff]+1}</small></span></button>
 <button id="rs" onclick="resetAll()" style="justify-content:center;font-size:.95rem;padding:10px;color:var(--mute)">Mulai dari awal</button>
 </div>`;
}

/* ---------- Pola angka ---------- */
function makeSeq(l){
 const types=[
  ()=>{const a=rnd(1,9),d=rnd(2,6);return{s:[0,1,2,3,4,5].map(i=>a+d*i),h:`Selisih tiap angka selalu sama.`}},
  ()=>{const a=rnd(1,4),r=rnd(2,3);return{s:[0,1,2,3,4].map(i=>a*r**i),h:`Setiap angka dikali bilangan yang sama.`}},
  ()=>{const a=rnd(1,5),d=rnd(1,4);return{s:[0,1,2,3,4,5].map(i=>i%2?a+d*i:a+d*i+10),h:`Perhatikan: ada dua pola yang berselang-seling.`}},
  ()=>{const a=rnd(1,3),b=rnd(2,4);const s=[a,b];for(let i=2;i<6;i++)s.push(s[i-1]+s[i-2]);return{s,h:`Angka berikutnya = jumlah dua angka sebelumnya.`}},
  ()=>{const a=rnd(1,3);return{s:[1,2,3,4,5,6].map(i=>(i+a)**2),h:`Semuanya adalah bilangan kuadrat.`}}
 ];
 const n=diff===0?(l<4?1:2):diff===1?(l<3?2:l<5?3:4):(l<2?3:5);const pool=types.slice(0,n);
 const t=pool[rnd(0,pool.length-1)]();
 const hide=diff===0?t.s.length-1:rnd(Math.max(3,t.s.length-3),t.s.length-1);
 const ans=t.s[hide];
 let o=new Set([ans]);
 while(o.size<4){const v=ans+rnd(-6,6)||ans+7;if(v>0&&v!==ans)o.add(v)}
 return{s:t.s,hide,ans,opts:shuffle([...o]),h:t.h};
}
function pattern(l){
 if(l>6){sv('p',1);return done('Pola Angka',()=>pattern(1))}sv('p',l);
 const q=makeSeq(l);let wrong=0,hint=false,over=false;
 app.innerHTML=`${bar('Pola Angka',`Level ${l} dari 6`)}<div class="prog"><i style="width:${(l-1)/6*100}%"></i></div>
 <div class="panel"><p>Angka apa yang menggantikan tanda tanya?</p>
 <div class="seq">${q.s.map((v,i)=>`<span class="${i===q.hide?'q':''}">${i===q.hide?'?':v}</span>`).join('')}</div>
 <div class="opts">${q.opts.map(v=>`<button data-v="${v}">${v}</button>`).join('')}</div>
 <p class="msg" id="m"></p>
 <div class="row"><button class="ghost" id="hb">💡 Petunjuk</button></div></div>`;
 $('#hb').onclick=()=>{hint=true;play('hint');$('#m').className='msg';$('#m').textContent=q.h};
 document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
  if(over)return;const ok=+b.dataset.v===q.ans;
  if(ok){over=true;play('ok');b.classList.add('ok');const st=Math.max(1,3-wrong-(hint?1:0));totalStars+=st;
   $('#m').className='msg ok';$('#m').textContent=`Benar! ${stars(st)}`;mood(st===3?'proud':'happy');
   $('.row').innerHTML=`<button onclick="pattern(${l+1})">Lanjut</button>`;
  }else{wrong++;play('no');b.classList.add('no');b.disabled=true;$('#m').className='msg no';$('#m').textContent='Belum tepat, coba cari aturannya lagi.';mood('sad')}
 });
}

/* ---------- Geser angka ---------- */
function slide(l){
 if(l>4){sv('s',1);return done('Geser Angka',()=>slide(1))}sv('s',l);
 let b=[1,2,3,4,5,6,7,8,0],last=-1;
 const nb=i=>{const r=Math.floor(i/3),c=i%3,n=[];if(r>0)n.push(i-3);if(r<2)n.push(i+3);if(c>0)n.push(i-1);if(c<2)n.push(i+1);return n};
 const sh=[2+l*2,4+l*4,8+l*6][diff];for(let k=0;k<sh;k++){const z=b.indexOf(0);const ch=nb(z).filter(x=>x!==last);const m=ch[rnd(0,ch.length-1)];b[z]=b[m];b[m]=0;last=z}
 let moves=0,won=false;const par=sh;
 const draw=()=>{
  $('#g').innerHTML=b.map((v,i)=>`<button class="tile ${v?'':'empty'} ${won?'right':''}" data-i="${i}" aria-label="${v||'kosong'}">${v||''}</button>`).join('');
  $('#mv').textContent=`Langkah: ${moves}`;
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
   if(won)return;const i=+t.dataset.i,z=b.indexOf(0);
   if(nb(i).includes(z)){b[z]=b[i];b[i]=0;moves++;play('tap');
    if(b.join()==='1,2,3,4,5,6,7,8,0'){won=true;play('win');const st=moves<=par?3:moves<=par*2?2:1;totalStars+=st;draw();
     $('#m').className='msg ok';$('#m').textContent=`Selesai dalam ${moves} langkah! ${stars(st)}`;mood(st===3?'proud':'happy');
     $('.row').innerHTML=`<button onclick="slide(${l+1})">Lanjut</button>`;return}
    draw()}
  });
 };
 app.innerHTML=`${bar('Geser Angka',`Level ${l} dari 4 · urutkan 1–8, kotak kosong di pojok kanan bawah`)}
 <div class="panel"><div class="pill" id="mv" style="text-align:center"></div><div class="grid" id="g"></div>
 <p class="msg" id="m">Target hemat: ${par} langkah atau kurang.</p>
 <div class="row"><button class="ghost" onclick="slide(${l})">Acak ulang</button></div></div>`;
 draw();
}

/* ---------- Teka-teki ---------- */
const RE=[
 {q:'Hewan apa yang bunyinya “meong”?',a:['kucing'],c:['kucing','anjing','sapi','ayam'],h:['Ia suka makan ikan.','Ia hewan peliharaan berkaki empat.']},
 {q:'Aku bulat, muncul di langit malam, dan bentukku bisa berubah. Apakah aku?',a:['bulan'],c:['bulan','matahari','awan','pelangi'],h:['Aku muncul saat gelap.','Kadang aku sabit, kadang purnama.']},
 {q:'Aku punya dua roda dan kamu mengayuhku. Apakah aku?',a:['sepeda'],c:['sepeda','mobil','perahu','kereta'],h:['Aku punya pedal.','Aku tidak butuh bensin.']},
 {q:'Aku dipakai untuk menulis di kertas dan bisa dihapus. Apakah aku?',a:['pensil'],c:['pensil','sendok','sisir','payung'],h:['Aku ada di tempat pensilmu.','Aku punya penghapus di ujungku.']},
 {q:'Aku turun dari langit dan membuat tanah basah. Apakah aku?',a:['hujan'],c:['hujan','debu','angin','petir'],h:['Kamu butuh payung saat aku datang.','Aku terbuat dari air.']}
];
const RM=[
 {q:'Aku punya mata tetapi tidak bisa melihat. Apakah aku?',a:['jarum'],h:['Aku dipakai untuk menjahit.','Benang masuk lewat mataku.']},
 {q:'Aku punya gigi tetapi tidak bisa menggigit. Apakah aku?',a:['sisir'],h:['Kamu memakaiku di rambut.','Aku ada di meja rias.']},
 {q:'Aku punya empat kaki tetapi tidak bisa berjalan. Apakah aku?',a:['meja','kursi'],h:['Kamu duduk atau makan di dekatku.','Aku ada di ruang makan.']},
 {q:'Aku punya banyak halaman dan kamu membalikku untuk membaca. Apakah aku?',a:['buku'],h:['Aku ada di perpustakaan.','Kamu membukaku untuk belajar.']},
 {q:'Aku bisa terbang tanpa sayap dan menangis tanpa mata. Apakah aku?',a:['awan'],h:['Aku ada di langit.','Aku menurunkan hujan.']}
];
const RH=[
 {q:'Aku punya kota tetapi tidak punya rumah, punya sungai tetapi tidak punya air. Apakah aku?',a:['peta'],h:['Kamu bisa melipatku.','Aku membantu orang tidak tersesat.']},
 {q:'Semakin banyak kamu ambil dariku, semakin besar aku. Apakah aku?',a:['lubang'],h:['Aku tidak punya isi.','Kamu bisa menggalinya di tanah.']},
 {q:'Aku punya dua jarum tetapi tidak bisa menjahit. Apakah aku?',a:['jam','jam dinding','jam tangan'],h:['Aku selalu bergerak maju.','Aku menunjukkan waktu.']},
 {q:'Semakin dikeringkan, aku semakin basah. Apakah aku?',a:['handuk','anduk'],h:['Kamu memakaiku setelah mandi.','Aku terbuat dari kain.']},
 {q:'Aku punya banyak tombol dan huruf tetapi bukan alat musik. Apakah aku?',a:['keyboard','papan ketik'],h:['Aku ada di laptop.','Kamu mengetik memakaiku.']},
 {q:'Aku selalu ada di depanmu, tetapi tidak pernah bisa kamu lihat. Apakah aku?',a:['masa depan','depan','future'],h:['Aku belum terjadi.','Lawan dari masa lalu.']}
];
const RD=[RE,RM,RH];
function riddle(i){
 const R=RD[diff];
 if(i>=R.length){sv('r',0);return done('Teka-Teki',()=>riddle(0))}sv('r',i);
 const r=R[i];let used=0,tries=0,over=false;
 app.innerHTML=`${bar('Teka-Teki',`Soal ${i+1} dari ${R.length}`)}<div class="prog"><i style="width:${i/R.length*100}%"></i></div>
 <div class="panel"><h2 style="font-weight:700">${r.q}</h2>
 ${diff===0&&r.c?`<div class="opts" id="ch">${shuffle(r.c).map(c=>`<button data-c="${c}">${c}</button>`).join('')}</div>`:''}<div class="row"><input id="ans" placeholder="Ketik jawabanmu" autocomplete="off" aria-label="Jawaban"><button id="go" style="flex:0 0 auto">Cek</button></div>
 <p class="msg" id="m"></p>
 <div class="row"><button class="ghost" id="hb">💡 Petunjuk (2)</button><button class="ghost" id="sk">Lewati</button></div></div>`;
 const m=$('#m'),chk=()=>{
  if(over)return;const v=$('#ans').value.trim().toLowerCase();if(!v)return;
  if(r.a.includes(v)){over=true;play('ok');const st=Math.max(1,3-used-Math.min(tries,1));totalStars+=st;
   m.className='msg ok';m.textContent=`Tepat! ${stars(st)}`;mood(st===3?'proud':'happy');$('.row:last-child').innerHTML=`<button onclick="riddle(${i+1})">Lanjut</button>`}
  else{tries++;play('no');m.className='msg no';m.textContent='Belum benar, coba pikirkan dari sudut lain.';mood('sad')}
 };
 $('#go').onclick=chk;document.querySelectorAll('#ch button').forEach(b=>b.onclick=()=>{$('#ans').value=b.dataset.c;chk()});$('#ans').onkeydown=e=>{if(e.key==='Enter')chk()};
 $('#hb').onclick=()=>{if(used<2){play('hint');m.className='msg';m.textContent='Petunjuk: '+r.h[used];used++;$('#hb').textContent=`💡 Petunjuk (${2-used})`;if(used===2)$('#hb').disabled=true}};
 $('#sk').onclick=()=>{if(!over){over=true;m.className='msg';m.textContent=`Jawabannya: ${r.a[0]}.`;$('.row:last-child').innerHTML=`<button onclick="riddle(${i+1})">Lanjut</button>`}};
}

function done(name,again){
 window._again=again;play('win');mood('proud','Kamu menamatkannya!');
 app.innerHTML=`${bar('Hebat!')}<div class="panel"><div class="stars">🎉</div><h2 style="text-align:center">Kamu menamatkan ${name}</h2>
 <p style="text-align:center">Total bintang: ${totalStars}</p>
 <div class="row"><button class="ghost" onclick="_again()">Main lagi</button><button onclick="home()">Menu utama</button></div></div>`;
}
home();
</script>
</body>
</html>
